
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clouddeploy
      POSTGRES_USER: clouddeploy
      POSTGRES_PASSWORD: ${5002:?Set POSTGRES_PASSWORD in your .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clouddeploy -d clouddeploy"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://clouddeploy:${POSTGRES_PASSWORD}@db:5432/clouddeploy
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
